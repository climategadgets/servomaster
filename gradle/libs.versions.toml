[versions]

assertj = "3.25.3"
errorprone-lib = "2.42.0"
errorprone-plugin = "5.1.0"
gradle-dependency-analysis = "1.30.0"
jacoco = "0.8.13"
junit = "6.1.0"
log4j = "2.20.0"
pi4j = "1.1"
rxtx = "2.1.7"
sonarqube = "4.4.1.3373"
usb4java = "1.2.0"

[libraries]

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
errorprone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-lib" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit5-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit5-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
pi4j = { module = "com.pi4j:pi4j-core", version.ref = "pi4j" }
rxtx = { module = "org.rxtx:rxtx", version.ref = "rxtx" }
usb4java = { module = "org.usb4java:usb4java-javax", version.ref = "usb4java" }

[plugins]

errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
gradle-dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "gradle-dependency-analysis" }
gradle-doctor = { id = "com.osacky.doctor", version = "0.9.2" }
gradle-versions = { id = "com.github.ben-manes.versions", version = "0.51.0"}
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
